name: Update LeetCode Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update-leetcode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download LeetCode card
        run: |
          mkdir -p profile

          URL="https://leetcard.jacoblin.cool/vaachi21?theme=dark&font=baloo2&ext=heatmap"

          for i in 1 2 3 4 5; do
            echo "Attempt $i..."

            STATUS=$(curl -L -s -o profile/leetcode.svg -w "%{http_code}" "$URL")

            if [ "$STATUS" = "200" ]; then
              echo "LeetCard downloaded successfully."
              exit 0
            fi

            echo "LeetCard returned HTTP $STATUS. Retrying..."
            sleep 10
          done

          echo "Failed to download a valid LeetCard after 5 attempts."
          exit 1

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/leetcode.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LeetCode stats"
            git push
          fi
